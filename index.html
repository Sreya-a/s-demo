<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Micro-Interactions Customizer</title>
<style>
:root{--bg:#f8fafc;--surface:#fff;--ink:#111827;--muted:#64748b;--line:#cbd5e1;--brand:#4f46e5;--brand2:#6366f1;--success:#16a34a;--shadow:0 14px 35px rgba(15,23,42,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.topbar{height:72px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 6vw;position:sticky;top:0;z-index:10}.brand{font-weight:800;font-size:20px;letter-spacing:-.03em}.nav{display:flex;gap:22px;align-items:center}.nav button{border:0;background:transparent;color:#475569;font-weight:600}.nav button:hover{color:var(--brand)}.pill{padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:#fff}.primary{background:var(--brand);color:#fff;border-color:var(--brand);padding:12px 18px;border-radius:10px;font-weight:700;box-shadow:0 8px 18px rgba(79,70,229,.22)}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);padding:11px 17px;border-radius:10px;font-weight:700}.page{max-width:1180px;margin:0 auto;padding:58px 28px 80px}.hero{text-align:center;padding:48px 0 28px}.eyebrow{display:inline-flex;padding:7px 12px;background:#eef2ff;color:#4338ca;border-radius:999px;font-weight:700;font-size:13px}.hero h1{font-size:52px;line-height:1.04;letter-spacing:-.055em;margin:20px auto 14px;max-width:850px}.hero p{color:var(--muted);font-size:18px;max-width:700px;margin:0 auto 28px}.hero-actions{display:flex;justify-content:center;gap:12px}.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:50px}.card{background:var(--surface);border:1px solid #e2e8f0;border-radius:18px;padding:24px;box-shadow:var(--shadow)}.card h3{margin:0 0 8px}.muted{color:var(--muted)}.screen-title{text-align:center;margin-bottom:34px}.screen-title h1{font-size:40px;margin:0 0 8px;letter-spacing:-.04em}.screen-title p{color:var(--muted);margin:0}.form-card{max-width:500px;margin:0 auto}.field{display:flex;flex-direction:column;gap:7px;margin:16px 0}.field label{font-weight:700;font-size:14px}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:13px 14px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px #eef2ff}.check{display:flex;gap:8px;align-items:center;color:#475569;font-size:14px}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.dashboard-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:20px}.projects{display:grid;gap:10px;margin-top:15px}.project{display:flex;justify-content:space-between;align-items:center;padding:14px;border:1px solid #e2e8f0;border-radius:12px;background:#fff}.quick{display:grid;gap:10px}.create-layout{display:grid;grid-template-columns:1fr .7fr;gap:22px}.settings-list{display:grid;gap:14px}.setting{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #e2e8f0}.switch{width:46px;height:26px;border-radius:999px;background:#cbd5e1;position:relative;border:0}.switch i{display:block;width:20px;height:20px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:.2s;box-shadow:0 2px 5px #0002}.switch.on{background:var(--brand)}.switch.on i{left:23px}.suggest-grid{display:grid;grid-template-columns:1fr .9fr;gap:22px}.suggestion{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:12px}.suggestion.selected{border:2px solid var(--brand);background:#eef2ff}.preview-shell{background:#0f172a;border-radius:20px;padding:22px;box-shadow:var(--shadow)}.preview-toolbar{display:flex;gap:8px;margin-bottom:18px}.dot{width:10px;height:10px;border-radius:50%;background:#94a3b8}.preview-window{background:#fff;border-radius:12px;min-height:300px;display:grid;place-items:center}.demo-btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:16px 28px;font-weight:800;box-shadow:0 10px 25px #4f46e54d}.demo-btn:hover{animation:spring .55s cubic-bezier(.34,1.56,.64,1)}@keyframes spring{0%{transform:scale(1)}45%{transform:scale(1.13)}75%{transform:scale(.96)}100%{transform:scale(1)}}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.control{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.export-grid{display:grid;grid-template-columns:.7fr 1.3fr;gap:22px}.formats{display:grid;gap:10px}.format{padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:left}.format.active{background:var(--brand);color:#fff;border-color:var(--brand)}pre{margin:0;background:#0b1220;color:#dbeafe;border-radius:14px;padding:22px;overflow:auto;min-height:250px}.toast{position:fixed;right:24px;bottom:24px;background:#111827;color:#fff;padding:13px 16px;border-radius:10px;box-shadow:var(--shadow);display:none;z-index:50}.toast.show{display:block}.footer{text-align:center;color:#94a3b8;padding:30px}.empty{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:800px){.nav{display:none}.hero h1{font-size:38px}.feature-grid,.dashboard-grid,.create-layout,.suggest-grid,.export-grid{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}.topbar{padding:0 20px}.page{padding:36px 18px 60px}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast"></div>
<script>
const state={suggestion:0,format:'CSS',settings:{dark:false,email:true,autosave:true,ai:true}};
const formats=['CSS','React','Flutter','Figma','Lottie JSON'];
const code={
CSS:`.button {\n  background: #4F46E5;\n  transition: transform 300ms cubic-bezier(.34,1.56,.64,1);\n}\n.button:hover { transform: scale(1.06); }`,
React:`<motion.button\n  whileHover={{ scale: 1.06 }}\n  transition={{ type: "spring", duration: 0.3 }}\n>\n  Create Animation\n</motion.button>`,
Flutter:`AnimatedScale(\n  scale: isHovered ? 1.06 : 1.0,\n  duration: const Duration(milliseconds: 300),\n  curve: Curves.elasticOut,\n)`,
Figma:`Interaction: While hovering\nAnimation: Smart Animate\nDuration: 300ms\nEasing: Spring`,
'Lottie JSON':`{\n  "v": "5.7.0",\n  "fr": 60,\n  "ip": 0,\n  "op": 18,\n  "nm": "Spring Button Hover"\n}`};
function nav(){return `<header class="topbar"><div class="brand">AI Motion</div><nav class="nav"><button onclick="go('dashboard')">Dashboard</button><button onclick="go('create')">Create</button><button onclick="go('preview')">Preview</button><button onclick="go('export')">Export</button><button onclick="go('settings')">Settings</button></nav><button class="secondary" onclick="go('login')">Login</button></header>`}
function shell(content,title=''){return `${nav()}<main class="page">${content}</main><div class="footer">AI Micro-Interactions Customizer · AI-powered motion design workspace</div>`}
function landing(){return `<main class="page"><section class="hero"><span class="eyebrow">AI · Motion · Productivity</span><h1>AI Micro-Interactions Customizer</h1><p>Create physics-based, responsive micro-animations using natural language prompts.</p><div class="hero-actions"><button class="primary" onclick="go('login')">Start Designing</button><button class="secondary" onclick="go('dashboard')">Explore Dashboard</button></div></section><section class="feature-grid"><div class="card"><h3>Natural Language</h3><p class="muted">Describe the interaction you want in plain English.</p></div><div class="card"><h3>Physics-based Motion</h3><p class="muted">Tune spring, duration, speed and easing for responsive results.</p></div><div class="card"><h3>Export Anywhere</h3><p class="muted">Preview and export code for CSS, React, Flutter, Figma or Lottie.</p></div></section></main>`}
function login(){return shell(`<div class="screen-title"><h1>Login</h1><p>Sign in to continue to your AI motion workspace.</p></div><div class="card form-card"><div class="field"><label>Email</label><input id="email" type="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="Enter password"></div><div class="row"><label class="check"><input type="checkbox"> Remember Me</label><button onclick="toast('Password reset link sent')" style="border:0;background:transparent;color:#4f46e5;font-weight:700">Forgot Password?</button></div><button class="primary" style="width:100%;margin-top:20px" onclick="loginGo()">Login</button><p style="text-align:center" class="muted">Don't have an account? <button onclick="toast('Demo account ready — use any email and password')" style="border:0;background:transparent;color:#4f46e5;font-weight:700;padding:0">Create New Account</button></p></div>`)}
function loginGo(){const email=document.getElementById('email')?.value.trim();const password=document.getElementById('password')?.value.trim();if(!email||!password){toast('Please enter email and password');return}toast('Login successful');setTimeout(()=>go('dashboard'),300)}
function dashboard(){return shell(`<div class="screen-title"><h1>Dashboard</h1><p>Welcome, User — manage your AI animation projects.</p></div><div class="dashboard-grid"><section class="card"><div class="row"><h3>Recent Projects</h3><button class="primary" onclick="go('create')">+ Create New Project</button></div><div class="projects"><button class="project" onclick="go('preview')"><span>Button Hover Animation</span><small class="muted">Edited today · Open</small></button><button class="project" onclick="go('preview')"><span>Login Success Animation</span><small class="muted">Edited yesterday · Open</small></button><button class="project" onclick="go('preview')"><span>Card Hover Effect</span><small class="muted">Edited 2 days ago · Open</small></button></div></section><aside class="card"><h3>Quick Actions</h3><div class="quick"><button class="secondary" onclick="go('create')">Generate Animation</button><button class="secondary" onclick="go('preview')">Preview</button><button class="secondary" onclick="go('export')">Export</button></div></aside></div>`)}
function create(){return shell(`<div class="screen-title"><h1>Create New Animation</h1><p>Describe the motion and let AI suggest responsive interactions.</p></div><div class="create-layout"><section class="card"><div class="field"><label>Project Name</label><input value="My Animation Project"></div><div class="field"><label>Platform</label><select><option>Web</option><option>React</option><option>Flutter</option><option>Figma</option></select></div><div class="field"><label>Animation Prompt</label><textarea rows="4">Create a smooth hover animation for a blue button with spring effect.</textarea></div><h3>Animation Settings</h3><div class="controls"><div class="control"><b>Duration</b><br><span class="muted">300 ms</span></div><div class="control"><b>Speed</b><br><span class="muted">Medium</span></div><div class="control"><b>Physics</b><br><span class="muted">Spring</span></div><div class="control"><b>Easing</b><br><span class="muted">Elastic</span></div></div><button class="primary" style="margin-top:20px" onclick="go('suggestions')">Generate Animation</button></section><aside class="card"><h3>AI Prompt Tips</h3><p class="muted">Mention the trigger, motion style, speed and desired feeling.</p><p><b>Example</b></p><p class="muted">“Make a button gently bounce on hover with a 300ms spring.”</p></aside></div>`)}
function suggestions(){return shell(`<div class="screen-title"><h1>AI Suggestions</h1><p>AI generated options based on your animation prompt.</p></div><div class="suggest-grid"><section>${[['Fade In','Spring','300 ms','Medium','100 ms'],['Spring Bounce','Spring','350 ms','Medium','0 ms'],['Elastic Pop','Elastic','280 ms','Fast','0 ms']].map((s,i)=>`<div class="suggestion ${state.suggestion===i?'selected':''}"><div><b>${s[0]}</b><div class="muted" style="margin-top:8px">Physics: ${s[1]} · Duration: ${s[2]} · Speed: ${s[3]} · Delay: ${s[4]}</div></div><button class="secondary" onclick="selectSuggestion(${i})">${state.suggestion===i?'Selected':'Apply'}</button></div>`).join('')}<button class="secondary" onclick="toast('New AI suggestions generated')">Regenerate</button></section><aside class="preview-shell"><div class="preview-toolbar"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><div class="preview-window"><button class="demo-btn">Animation Preview</button></div></aside></div>`)}
function selectSuggestion(i){state.suggestion=i;toast('Suggestion applied');render()}
function preview(){return shell(`<div class="screen-title"><h1>Live Preview</h1><p>Test your generated micro-interaction across responsive previews.</p></div><div class="card"><h3>Desktop Preview</h3><div class="preview-shell"><div class="preview-toolbar"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><div class="preview-window"><button class="demo-btn">Hover Me</button></div></div><div style="margin-top:18px"><h3>Mobile Preview</h3><div class="card" style="max-width:360px;margin:auto;display:grid;place-items:center;min-height:160px"><button class="demo-btn">Animation</button></div></div><div class="controls"><div class="control"><b>Duration</b><br><span class="muted">300 ms</span></div><div class="control"><b>Physics</b><br><span class="muted">Spring</span></div><div class="control"><b>Easing</b><br><span class="muted">Elastic</span></div><div class="control"><b>Iterations</b><br><span class="muted">1</span></div></div><div class="hero-actions" style="margin-top:20px"><button class="secondary" onclick="toast('Preview playing')">Play</button><button class="secondary" onclick="toast('Preview paused')">Pause</button><button class="secondary" onclick="toast('Preview restarted')">Restart</button><button class="primary" onclick="go('export')">Export</button></div></div>`)}
function exportPage(){return shell(`<div class="screen-title"><h1>Export Animation</h1><p>Choose a format and copy or download the generated implementation.</p></div><div class="export-grid"><section class="card"><h3>Choose Format</h3><div class="formats">${formats.map(f=>`<button class="format ${state.format===f?'active':''}" onclick="setFormat('${f}')">${f}</button>`).join('')}</div></section><section class="card"><h3>Generated Code Preview</h3><pre id="code">${escapeHtml(code[state.format])}</pre><div class="hero-actions" style="justify-content:flex-start;margin-top:16px"><button class="secondary" onclick="downloadCode()">Download</button><button class="secondary" onclick="copyCode()">Copy Code</button><button class="primary" onclick="toast('Export ready — file downloaded')">Export</button></div></section></div>`)}
function setFormat(f){state.format=f;render()}
async function copyCode(){try{await navigator.clipboard.writeText(code[state.format]);toast('Code copied to clipboard')}catch(e){toast('Select and copy the code manually')}}
function downloadCode(){const ext=state.format==='CSS'?'css':state.format==='React'?'jsx':state.format==='Flutter'?'dart':state.format==='Figma'?'txt':'json';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([code[state.format]],{type:'text/plain'}));a.download='ai-motion-animation.'+ext;a.click();toast('Code file downloaded')}
function settings(){return shell(`<div class="screen-title"><h1>Settings</h1><p>Manage your profile and animation workspace preferences.</p></div><div class="card" style="max-width:760px;margin:auto"><h3>Profile Information</h3><div class="card" style="box-shadow:none;background:#f8fafc;margin:15px 0 20px"><p><b>Name:</b> Jarin Sreya</p><p><b>Email:</b> jarin@example.com</p><p><b>Role:</b> Designer</p></div><div class="settings-list">${[['dark','Dark Mode'],['email','Email Notifications'],['autosave','Auto Save Projects'],['ai','Enable AI Suggestions']].map(([k,t])=>`<div class="setting"><span>${t}</span><button class="switch ${state.settings[k]?'on':''}" onclick="toggleSetting('${k}')"><i></i></button></div>`).join('')}</div><div class="field" style="max-width:220px;margin-top:24px"><label>Language</label><select><option>English</option><option>বাংলা</option></select></div><button class="primary" onclick="toast('Settings saved')">Save Changes</button><button class="secondary" style="margin-left:8px" onclick="go('landing')">Logout</button></div>`)}
function toggleSetting(k){state.settings[k]=!state.settings[k];render()}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1800)}
function go(route){location.hash=route;render()}
function render(){const r=location.hash.slice(1)||'landing';let html=r==='landing'?landing():r==='login'?login():r==='dashboard'?dashboard():r==='create'?create():r==='suggestions'?suggestions():r==='preview'?preview():r==='export'?exportPage():r==='settings'?settings():landing();document.getElementById('app').innerHTML=html}
window.addEventListener('hashchange',render);render();
</script>
</body></html>
